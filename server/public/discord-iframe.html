<!DOCTYPE html>
<html lang="en">
<!--
  Discord-Compatible World Chat iFrame Wrapper
  Provides a clean, responsive, Discord-proportioned iframe container embedding
  World Chat in compact ?embed=discord mode with required clipboard/fullscreen
  permissions and strict referrer policy.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Chat — Discord Embed Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e1f22;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .discord-frame-shell {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 760px;
      background: #2b2d31;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    }
    .discord-worldchat-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #1a2230;
    }
  </style>
</head>
<body>
  <div class="discord-frame-shell">
    <iframe
      id="worldchat-discord-iframe"
      class="discord-worldchat-iframe"
      src="/?embed=discord"
      title="World Chat — Global Live Chat"
      allow="clipboard-write; fullscreen; autoplay"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="lazy"
    ></iframe>
  </div>
</body>
</html>
